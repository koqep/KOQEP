services:
  - type: web
    name: koqep-api
    runtime: node
    plan: starter
    rootDir: apps/api
    buildCommand: npm install && npm run db:generate && npm run build
    preDeployCommand: npm run db:migrate:deploy && npm run db:seed
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: WEB_ORIGIN
        sync: false
