services:
  - type: web
    name: koqep-api
    runtime: node
    plan: starter
    rootDir: apps/api
    # buildCommand'da bilinclendirilmis olarak "prisma generate" YOK:
    # apps/api/package.json'daki postinstall script'i her npm install'da
    # otomatik calisiyor. Bu, buildCommand'dan tamamen bagimsiz calisir -
    # panel elle yapilandirilmis ve render.yaml ile senkron olmasa bile
    # ayni sonucu garanti eder (bkz. STATE.md tuzak notu).
    buildCommand: npm install && npm run build
    preDeployCommand: npm run db:migrate:deploy && npm run db:seed && npm run db:backfill-totp-secrets && npm run db:backfill-room-members
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      # Kanonik, www'suz origin (ör. https://koqep.com) - e-posta
      # doğrulama/şifre sıfırlama linklerinin (auth.service.ts) TEK taban
      # URL'i olarak kullanılıyor. CORS (main.ts, messages.gateway.ts) ayrıca
      # buradan www. karşılığını da otomatik türetip ikisine birden izin
      # veriyor (bkz. allowed-origins.ts) - www için AYRI bir env var YOK.
      - key: WEB_ORIGIN
        sync: false
      # M1 Slice C: sifre sifirlama e-postalari icin. Hesap + API key
      # yeterli (Resend'in paylasimli onboarding@resend.dev adresinden
      # gonderir, domain dogrulamasi gerekmez). Deger dashboard'dan elle
      # girilmeli.
      - key: RESEND_API_KEY
        sync: false
      # M3 Slice B: POST /internal/rooms/lifecycle-sweep'i korumak icin
      # (CronSecretGuard, x-cron-secret header). GitHub Actions'daki
      # secrets.CRON_SECRET ile BIREBIR AYNI olmali. DIKKAT: bu dosya canli
      # Render servisine bagli degil (bkz. STATE.md tuzak notu) - deger yine
      # de Render dashboard'undan elle girilmek zorunda, burasi sadece
      # dokumantasyon amacli.
      - key: CRON_SECRET
        sync: false
      # Opsiyonel — sadece kendi domain'ini Resend'de dogruladiktan sonra
      # ayarla (SPF/DKIM/DMARC, bkz. docs/milestones/M6-launch-readiness.md).
      # Ayarlanmazsa kod onboarding@resend.dev'e duser.
      - key: EMAIL_FROM_ADDRESS
        sync: false
      # apps/api/src/db/seed.ts'in dev kullanici + DEV_INVITE_CODES olusturma
      # kismi opt-in (bkz. dosyadaki yorum) - git'te duz metin duran bilinen
      # kimlik bilgileri/davet kodlari production'da sessizce olusmasin diye.
      # false = varsayilan/guvenli. DIKKAT: bu dosya canli Render servisine
      # bagli degil (bkz. STATE.md tuzak notu) - degeri burada false olsa
      # bile, gercek guvenlik zaten env yokken/false disinda bir deger yokken
      # saglaniyor; bu sadece dokumantasyon amacli.
      - key: SEED_DEV_FIXTURES
        value: 'false'
      # M6 Slice E (ADR-0008): User.totpSecret alan-seviyesinde AES-256-GCM
      # ile sifreleniyor. Deger `node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"`
      # ile uretilir - base64 cozüldüğünde TAM 32 byte olmali, yoksa
      # sifreleme/desifre çağrıları açık bir hatayla düşer. Bu dosya canli Render
      # servisine bagli DEGIL (bkz. STATE.md tuzak notu) - deger Render
      # dashboard'undan elle girilmek ZORUNDA, VE Render disinda da (sifre
      # yoneticisi vb.) ayrıca yedeklenmeli - bu anahtar kaybolursa TUM
      # sifreli totpSecret satırları kalıcı okunamaz olur (kurtarma
      # prosedürü: docs/THREAT-MODEL.md satır 39, ADR-0008).
      - key: TOTP_ENCRYPTION_KEY
        sync: false
