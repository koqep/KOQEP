name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: koqep
          POSTGRES_PASSWORD: koqep
          POSTGRES_DB: koqep_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U koqep"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://koqep:koqep@localhost:5432/koqep_dev?schema=public
      JWT_SECRET: ci-only-test-secret
      RESEND_API_KEY: ci-only-test-key
      WEB_ORIGIN: http://localhost:3000
      # M6 Slice E (ADR-0008): sahte/test-only bir anahtar - gerçek secret
      # değil, sadece 32 byte'a decode olan rastgele bir base64 string.
      TOTP_ENCRYPTION_KEY: eozn7Vvw6od7EQ0F/rj4tuMxweYyLAAllg9lm7GDVBs=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint --workspace=apps/api
      - run: npm run typecheck --workspace=apps/api
      - run: npm run db:migrate:deploy --workspace=apps/api
      - run: npm run db:seed --workspace=apps/api
      - run: npm run db:backfill-totp-secrets --workspace=apps/api
      - run: npm run db:backfill-room-members --workspace=apps/api
      - run: npm run db:backfill-message-content-pii --workspace=apps/api
      - run: npm run test --workspace=apps/api
      - run: npm run test:e2e --workspace=apps/api
      - run: npm run build --workspace=apps/api

  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint --workspace=apps/web
      - run: npm run typecheck --workspace=apps/web
      - run: npx playwright install --with-deps chromium
      - run: npm run build --workspace=apps/web
      - run: npm run test:e2e --workspace=apps/web
      # M7a Slice A sonrası bir CI koşusunda tek bir test hiçbir iz
      # bırakmadan açıklanamayan şekilde başarısız oldu, sonra 240+ tekrar
      # denemesinde bir daha hiç tekrarlanmadı - playwright.config.ts'in
      # trace:'retain-on-failure'ı artık gerçek bir kanıt üretiyor, ama
      # CI bunu YÜKLEMEZSE iş bitince siliniyor. Sadece başarısızlıkta.
      - name: Playwright trace'ini başarısızlıkta yükle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace-test-web
          path: test-results/
          retention-days: 7

  test-fullstack-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: koqep
          POSTGRES_PASSWORD: koqep
          POSTGRES_DB: koqep_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U koqep"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://koqep:koqep@localhost:5432/koqep_dev?schema=public
      JWT_SECRET: ci-only-test-secret
      RESEND_API_KEY: ci-only-test-key
      WEB_ORIGIN: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:3001
      SEED_DEV_FIXTURES: 'true'
      # M6 Slice E (ADR-0008): sahte/test-only bir anahtar - gerçek secret
      # değil, sadece 32 byte'a decode olan rastgele bir base64 string.
      TOTP_ENCRYPTION_KEY: eozn7Vvw6od7EQ0F/rj4tuMxweYyLAAllg9lm7GDVBs=
      # Gerçek /auth/signup çağıran fullstack testler (invite-issuance.spec.ts)
      # gerçek bir sunucu sürecine (start:prod) karşı koşuyor - DI seviyesinde
      # EmailService override edilemez, bu yüzden EmailService kendi içinde
      # kesin string eşitliğiyle (=== 'fake') gerçek Resend çağrısını atlıyor.
      # SADECE bu job'da set edilir - production'a asla sızmamalı (bkz.
      # apps/api/src/render-config.spec.ts).
      EMAIL_TRANSPORT: 'fake'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run db:migrate:deploy --workspace=apps/api
      - run: npm run db:seed --workspace=apps/api
      - run: npm run db:backfill-totp-secrets --workspace=apps/api
      - run: npm run db:backfill-room-members --workspace=apps/api
      - run: npm run db:backfill-message-content-pii --workspace=apps/api
      - run: npm run build --workspace=apps/api
      - run: npm run build --workspace=apps/web
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:fullstack --workspace=apps/web
      - name: Playwright trace'ini başarısızlıkta yükle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace-test-fullstack-e2e
          path: test-results/
          retention-days: 7
