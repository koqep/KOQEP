name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: koqep
          POSTGRES_PASSWORD: koqep
          POSTGRES_DB: koqep_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U koqep"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://koqep:koqep@localhost:5432/koqep_dev?schema=public
      JWT_SECRET: ci-only-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run db:generate --workspace=apps/api
      - run: npm run lint --workspace=apps/api
      - run: npm run typecheck --workspace=apps/api
      - run: npm run db:migrate:deploy --workspace=apps/api
      - run: npm run db:seed --workspace=apps/api
      - run: npm run test --workspace=apps/api
      - run: npm run test:e2e --workspace=apps/api
      - run: npm run build --workspace=apps/api

  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint --workspace=apps/web
      - run: npm run typecheck --workspace=apps/web
      - run: npx playwright install --with-deps chromium
      - run: npm run build --workspace=apps/web
      - run: npm run test:e2e --workspace=apps/web
